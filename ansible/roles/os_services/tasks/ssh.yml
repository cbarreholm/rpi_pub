---
# tasks file for ssh service

- name: Install openssh-server package (if not present)
  become: true
  ansible.builtin.apt:
    install_recommends: true
    name: "{{ packages }}"
    state: present
    # dpkg_options: 'force-confnew'
  vars:
    packages:
      - openssh-server
  tags: ssh

- name: Configure SSH Service (Port 22)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#Port(.*)'
    line: 'Port 22'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (AddressFamily inet)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#AddressFamily(.*)'
    line: 'AddressFamily inet'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (ListenAddress 0.0.0.0)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#ListenAddress 0.0.0.0'
    line: 'ListenAddress 0.0.0.0'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (AllowTcpForwarding no)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#AllowTcpForwarding(.*)'
    line: 'AllowTcpForwarding no'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (ClientAliveCountMax 2)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#ClientAliveCountMax(.*)'
    line: 'ClientAliveCountMax 2'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (MaxAuthTries 3)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#MaxAuthTries(.*)'
    line: 'MaxAuthTries 3'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (MaxSessions 2)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#MaxSessions(.*)'
    line: 'MaxSessions 2'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (TCPKeepAlive no)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#TCPKeepAlive(.*)'
    line: 'TCPKeepAlive no'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (X11Forwarding no)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^X11Forwarding(.*)'
    line: 'X11Forwarding no'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (AllowAgentForwarding no)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#AllowAgentForwarding(.*)'
    line: 'AllowAgentForwarding no'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (Compression no)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#Compression(.*)'
    line: 'Compression no'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

# VERBOSE ensures SSH auth failures are visible to fail2ban's sshd jail
- name: Configure SSH Service (LogLevel VERBOSE)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#?LogLevel(.*)'
    line: 'LogLevel VERBOSE'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (Ciphers)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#?Ciphers(.*)'
    line: 'Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (MACs)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#?MACs(.*)'
    line: 'MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (KexAlgorithms)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#?KexAlgorithms(.*)'
    line: 'KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group14-sha256'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (LoginGraceTime 30)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#?LoginGraceTime(.*)'
    line: 'LoginGraceTime 30'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (PermitEmptyPasswords no)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#?PermitEmptyPasswords(.*)'
    line: 'PermitEmptyPasswords no'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (PermitRootLogin no)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#PermitRootLogin(.*)'
    line: 'PermitRootLogin no'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (PasswordAuthentication no)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#PasswordAuthentication(.*)'
    line: 'PasswordAuthentication no'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh


- name: Configure SSH Service (UsePAM no)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#UsePAM(.*)'
    line: 'UsePAM no'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Configure SSH Service (AllowGroups ssh-users)
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#AllowGroups(.*)'
    line: 'AllowGroups ssh-users'
    validate: '/usr/sbin/sshd -T -f %s'
  tags: ssh

- name: Reload ssh
  become: true
  ansible.builtin.service:
    name: ssh
    state: reloaded
  changed_when: false
  tags: ssh

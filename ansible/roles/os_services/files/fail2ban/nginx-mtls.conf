[Definition]
# Match nginx JSON access log entries where the TLS handshake completed
# but the client did not present a valid certificate. Covers NONE (no
# cert sent) and FAILED:* (cert sent but rejected). The "-" value
# (TLS layer not reached) is intentionally excluded — those cases are
# malformed/pre-TLS junk that other jails handle.
failregex = ^(?=.*"response":\s*400)(?=.*"ssl_client_verify":"(?:NONE|FAILED[^"]*)").*"clientip":"<HOST>".*$
ignoreregex =

---
# tasks file for OS users


- name: "Not allowed to run as 'pi' user. Create alternative user first."
  fail:
    msg: "Playbook must not be run as the 'pi' user. Create an alternative sudo user first and re-run as that user."
  when: ansible_user_id == 'pi'
  tags: users


- name: Update `pi` with auto generated password
  become: yes
  user:
    name: pi
    password: "{{ lookup('password', 'credentials/pi/password.txt encrypt=sha512_crypt') }}"
  when: ansible_user_id != 'pi'
  tags: users

- name: Remove generated pi password file from controller
  local_action: file path="credentials/pi/password.txt" state=absent
  when: ansible_user_id != 'pi'
  tags: users

- name: "Disable 'pi' user"
  become: yes
  user:
    name: pi
    shell: /sbin/nologin
    password_lock: true
    expires: 1.0
  when: ansible_user_id != 'pi'
  tags: users


- name: "Create SSH group 'ssh-users'"
  become: yes
  group:
    name: ssh-users
  when: ansible_user_id != 'pi'
  tags: ssh


# Accepted risk: the alt user has passwordless sudo (via Raspberry Pi OS default
# sudoers). This is required for Ansible to run become tasks without a password.
# Compensating control: SSH key-only authentication is enforced, so a compromised
# session requires a stolen private key, not just a password.
- name: "Adding user '{{ ansible_user_id }}'' to 'ssh-users'"
  become: yes
  user: 
    name: "{{ ansible_user_id }}"
    groups: [ssh-users]
    append: yes
  when: ansible_user_id != 'pi'
  tags: ssh

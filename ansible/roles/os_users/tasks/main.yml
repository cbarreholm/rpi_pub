---
# tasks file for OS users


- name: Abort if running as default platform user
  ansible.builtin.fail:
    msg: "Playbook must not be run as the '{{ platform_default_user }}' user. Create an alternative sudo user first and re-run as that user."
  when: ansible_user_id == platform_default_user
  tags: users


- name: Update default user with auto generated password
  become: true
  ansible.builtin.user:
    name: "{{ platform_default_user }}"
    password: "{{ lookup('password', 'credentials/' + platform_default_user + '/password.txt encrypt=sha512_crypt') }}"
  when: ansible_user_id != platform_default_user
  tags: users

- name: Remove generated password file from controller
  local_action: ansible.builtin.file path="credentials/{{ platform_default_user }}/password.txt" state=absent
  when: ansible_user_id != platform_default_user
  tags: users

- name: Disable default platform user
  become: true
  ansible.builtin.user:
    name: "{{ platform_default_user }}"
    shell: /sbin/nologin
    password_lock: true
    expires: 1.0
  when: ansible_user_id != platform_default_user
  tags: users


- name: "Create SSH group 'ssh-users'"
  become: true
  ansible.builtin.group:
    name: ssh-users
  when: ansible_user_id != platform_default_user
  tags: ssh


# Accepted risk: the alt user has passwordless sudo (via Raspberry Pi OS default
# sudoers). This is required for Ansible to run become tasks without a password.
# Compensating control: SSH key-only authentication is enforced, so a compromised
# session requires a stolen private key, not just a password.
- name: Add current user to ssh-users group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: [ssh-users]
    append: true
  when: ansible_user_id != platform_default_user
  tags: ssh


- name: Create alt-admins group
  become: true
  ansible.builtin.group:
    name: alt-admins
    state: present
  when: additional_admin_users | length > 0
  tags: users

- name: Configure passwordless sudo for alt-admins group
  become: true
  ansible.builtin.copy:
    dest: /etc/sudoers.d/099_alt-admins-nopasswd
    content: "%alt-admins ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: additional_admin_users | length > 0
  tags: users

- name: Create additional admin user accounts
  become: true
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/bash
    create_home: true
    password_lock: true
  loop: "{{ additional_admin_users }}"
  when: additional_admin_users | length > 0
  tags: users

- name: Configure SSH authorized key for additional admin users
  become: true
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_public_key }}"
    state: present
    exclusive: false
  loop: "{{ additional_admin_users }}"
  when: additional_admin_users | length > 0
  tags: users

- name: Add additional admin users to alt-admins and ssh-users groups
  become: true
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups:
      - alt-admins
      - ssh-users
    append: true
  loop: "{{ additional_admin_users }}"
  when: additional_admin_users | length > 0
  tags: users


- name: Create limited user accounts
  become: true
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: "{{ item.shell }}"
    create_home: true
    password_lock: true
  loop: "{{ additional_limited_users }}"
  when: additional_limited_users | length > 0
  tags: users

- name: Configure SSH authorized key for limited users
  become: true
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_public_key }}"
    state: present
    exclusive: false
  loop: "{{ additional_limited_users }}"
  when:
    - additional_limited_users | length > 0
    - item.ssh_public_key is defined
  tags: users

- name: Add limited users with SSH key to ssh-users group
  become: true
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups:
      - ssh-users
    append: true
  loop: "{{ additional_limited_users }}"
  when:
    - additional_limited_users | length > 0
    - item.ssh_public_key is defined
  tags: users

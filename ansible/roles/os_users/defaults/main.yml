---
# defaults file for OS users
platform_default_user: pi

# List of additional admin users to provision.
# Define the real value in ansible/secrets/secrets_file.enc (ansible-vault),
# NOT in inventory or host_vars — usernames and SSH keys are sensitive intel.
# Each entry must have:
#   name: <string>           — the username
#   ssh_public_key: <string> — the full public key line
additional_admin_users: []

# List of limited users to provision (e.g. git shell users).
# Each entry must have:
#   name: <string>            — the username
#   shell: <string>           — the login shell (e.g. /usr/bin/git-shell, /bin/rbash)
#   ssh_public_key: <string>  — (optional) the full public key line;
#                               omit to deny SSH login for this user
# Note: /usr/bin/git-shell must be listed in /etc/shells on the target host.
#       Debian adds it automatically when the 'git' package is installed.
additional_limited_users: []
